33"/><rect x="1004" y="508" width="410" height="12" rx="6" fill="#c8f560"/><text x="1466" y="520" fill="#ecebe6" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="end">0.93</text><text x="980" y="604" fill="#85858f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Generated FAQ</text><rect x="980" y="620" width="510" height="80" rx="12" fill="#1c1d23" stroke="#2a2b33" stroke-width="2"/><text x="1004" y="653" fill="#ecebe6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Q  How long do refunds take?</text><text x="1004" y="682" fill="#8fa6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A  5–7 business days</text><rect x="980" y="714" width="510" height="80" rx="12" fill="#1c1d23" stroke="#2a2b33" stroke-width="2"/><text x="1004" y="747" fill="#ecebe6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Q  Is shipping free?</text><text x="1004" y="776" fill="#85858f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A  on all orders above ₹999</text><rect x="980" y="808" width="510" height="80" rx="12" fill="#1c1d23" stroke="#2a2b33" stroke-width="2"/><text x="1004" y="841" fill="#ecebe6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Q  How long is delivery?</text><text x="1004" y="870" fill="#85858f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A  3–5 days</text><rect x="110" y="700" width="820" height="186" rx="14" fill="#1c1d23" stroke="#2a2b33" stroke-width="2"/><text x="140" y="744" fill="#ecebe6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">How it works</text><rect 